<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="../css/gamestyle.css">
</head>

<body >
    <div id="background"></div>
    <button id="openSettings">
        <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#e3e3e3"><path d="M120-240v-66.67h720V-240H120Zm0-206.67v-66.66h720v66.66H120Zm0-206.66V-720h720v66.67H120Z"/></svg>
    </button>

    <div id="endScreen" class="endScreen">

        <div class="endInner">

            <h2 id="status"></h2>
            <button id="restartGame">PLAY AGAIN</button>
            <button id="homeScreenEnd">GO HOME</button>

        </div>

    </div>

    <div id="settingsUi" class="settingsUi">

        <div class="settingsInner">
            <h2>END THIS SESSION?</h2>
            <button id="closeSettings">CONTINUE</button>
            <button id="homeScreen">HOME SCREEN</button>
        </div>

    </div>

    <div id="center">

        <div id="round" class="round">
            
        </div>

        <div id="instruction"class="instruction">
            <h1 id="textInstruction" class ="textInstruction">
                PICK
            </h1>
        </div>

        <div id="option" class="options">
            
            <a>
            <button id="rock" class="rock">
                🪨
            </button>
            <button id="paper" class="paper">
                📄
            </button>
            <button id="scissors" class="scissors">
                ✂️
            </button>
            </a>
        </div>

        <div class="hands">
            <div>
                <div>
                    <img id="humanHand" class="loop" src="../img/rockhandhuman.png">
                </div>
            </div>

            <div >
                <div>
                    <img id="computerHand" class="loop" src="../img/rockhand.png">
                </div>
            </div>
        </div>

        <div class="scoreboard">
        <div id="humanScore">
            0
        </div>
        <div id="computerScore">
            0
        </div>
        </div>

        <div class="watermark">
            Created by:&nbsp;
            <span>
                <a href="https://github.com/brynmanalang-dev" rel="noreferrer noopener" target="_blank">
                     brynmanalang-dev
                </a>
            </span>
        </div>
    </div>
    <script src="../js/animations.js"></script>
    <script src="../js/game.js"></script>
</body>

</html>
